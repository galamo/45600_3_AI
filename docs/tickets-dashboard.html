<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tickets Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --input: #121a24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #1a2332 0%, var(--bg) 100%);
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      font-weight: 600;
    }
    header .meta {
      color: var(--muted);
      font-size: 0.875rem;
    }
    header .meta strong { color: var(--text); font-weight: 500; }
    main {
      padding: 1.25rem 1.5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .filters input,
    .filters select {
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 0.9rem;
    }
    .filters .search { grid-column: 1 / -1; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      min-width: 120px;
    }
    .stat .n { font-size: 1.4rem; font-weight: 600; }
    .stat .l { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .chart-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
    }
    .chart-panel h2 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .chart-wrap {
      position: relative;
      height: 260px;
    }
    .table-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
    }
    .table-panel h2 {
      margin: 0;
      padding: 1rem 1rem 0.5rem;
      font-size: 0.95rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 1rem;
      border-top: 1px solid var(--border);
    }
    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    tr:hover td { background: rgba(61, 139, 253, 0.06); }
    .empty {
      padding: 1.5rem 1rem;
      color: var(--muted);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #243044;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tickets Dashboard</h1>
    <p class="meta">
      Generated by <strong id="generatedBy">galamo</strong>
      ·
      <time id="generatedAt" datetime="2026-11-22T20:00:50+02:00">2026-11-22T20:00:50+02:00</time>
    </p>
  </header>

  <main>
    <section class="filters" aria-label="Filters">
      <label class="search">Search title
        <input type="search" id="filterQ" placeholder="Filter by title…" />
      </label>
      <label>Status
        <select id="filterStatus"><option value="">All</option></select>
      </label>
      <label>Project
        <select id="filterProject"><option value="">All</option></select>
      </label>
      <label>Sprint
        <select id="filterSprint"><option value="">All</option></select>
      </label>
      <label>Assignee
        <select id="filterAssignee"><option value="">All</option></select>
      </label>
    </section>

    <section class="stats" aria-label="Summary">
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Total</div></div>
      <div class="stat"><div class="n" id="statFiltered">0</div><div class="l">Filtered</div></div>
    </section>

    <section class="charts">
      <div class="chart-panel">
        <h2>By status</h2>
        <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
      </div>
      <div class="chart-panel">
        <h2>By project</h2>
        <div class="chart-wrap"><canvas id="barChart"></canvas></div>
      </div>
    </section>

    <section class="table-panel">
      <h2>Tickets</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Project</th>
            <th>Sprint</th>
            <th>Assignee</th>
          </tr>
        </thead>
        <tbody id="ticketBody"></tbody>
      </table>
      <div class="empty" id="emptyState" hidden>No tickets match the filters.</div>
    </section>
  </main>

  <script>
    const TICKETS = [

  {

  {

    "status": "open",

    "assignee": "avivl"
  }
];

    const COLORS = [
      "#3d8bfd", "#34c759", "#ff9f0a", "#ff453a", "#bf5af2",
      "#64d2ff", "#ffd60a", "#ac8e68", "#5e5ce6", "#ff375f"
    ];

    const els = {
      q: document.getElementById("filterQ"),
      status: document.getElementById("filterStatus"),
      project: document.getElementById("filterProject"),
      sprint: document.getElementById("filterSprint"),
      assignee: document.getElementById("filterAssignee"),
      body: document.getElementById("ticketBody"),
      empty: document.getElementById("emptyState"),
      total: document.getElementById("statTotal"),
      filtered: document.getElementById("statFiltered"),
    };

    let pieChart;
    let barChart;

    function uniqSorted(values) {
      return [...new Set(values.filter(Boolean))].sort((a, b) =>
        String(a).localeCompare(String(b))
      );
    }

    function fillSelect(select, values) {
      const current = select.value;
      while (select.options.length > 1) select.remove(1);
      for (const v of values) {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      }
      if ([...select.options].some((o) => o.value === current)) select.value = current;
    }

    function initFilters() {
      fillSelect(els.status, uniqSorted(TICKETS.map((t) => t.status)));
      fillSelect(els.project, uniqSorted(TICKETS.map((t) => t.project)));
      fillSelect(els.sprint, uniqSorted(TICKETS.map((t) => t.sprint)));
      fillSelect(els.assignee, uniqSorted(TICKETS.map((t) => t.assignee)));
    }

    function filteredTickets() {
      const q = els.q.value.trim().toLowerCase();
      return TICKETS.filter((t) => {
        if (els.status.value && t.status !== els.status.value) return false;
        if (els.project.value && t.project !== els.project.value) return false;
        if (els.sprint.value && t.sprint !== els.sprint.value) return false;
        if (els.assignee.value && t.assignee !== els.assignee.value) return false;
        if (q && !String(t.title || "").toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function countBy(rows, key) {
      const map = {};
      for (const row of rows) {
        const k = row[key] || "None";
        map[k] = (map[k] || 0) + 1;
      }
      const labels = Object.keys(map).sort((a, b) => map[b] - map[a] || a.localeCompare(b));
      return { labels, data: labels.map((l) => map[l]) };
    }

    function renderTable(rows) {
      els.body.innerHTML = rows
        .map(
          (t) => `<tr>
            <td>${t.id ?? ""}</td>
            <td>${escapeHtml(t.title || "")}</td>
            <td><span class="badge">${escapeHtml(t.status || "")}</span></td>
            <td>${escapeHtml(t.project || "")}</td>
            <td>${escapeHtml(t.sprint || "")}</td>
            <td>${escapeHtml(t.assignee || "")}</td>
          </tr>`
        )
        .join("");
      els.empty.hidden = rows.length > 0;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderCharts(rows) {
      const byStatus = countBy(rows, "status");
      const byProject = countBy(rows, "project");

      const pieData = {
        labels: byStatus.labels,
        datasets: [{
          data: byStatus.data,
          backgroundColor: byStatus.labels.map((_, i) => COLORS[i % COLORS.length]),
          borderWidth: 0,
        }],
      };
      const barData = {
        labels: byProject.labels,
        datasets: [{
          label: "Tickets",
          data: byProject.data,
          backgroundColor: byProject.labels.map((_, i) => COLORS[i % COLORS.length]),
          borderWidth: 0,
          borderRadius: 4,
        }],
      };

      const commonOpts = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: "#8b9bb4" } },
        },
      };

      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById("pieChart"), {
        type: "pie",
        data: pieData,
        options: {
          ...commonOpts,
          plugins: {
            ...commonOpts.plugins,
            legend: { position: "bottom", labels: { color: "#8b9bb4" } },
          },
        },
      });

      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: barData,
        options: {
          ...commonOpts,
          scales: {
            x: {
              ticks: { color: "#8b9bb4" },
              grid: { color: "rgba(45,58,77,0.6)" },
            },
            y: {
              beginAtZero: true,
              ticks: { color: "#8b9bb4", precision: 0 },
              grid: { color: "rgba(45,58,77,0.6)" },
            },
          },
          plugins: { legend: { display: false } },
        },
      });
    }

    function refresh() {
      const rows = filteredTickets();
      els.total.textContent = String(TICKETS.length);
      els.filtered.textContent = String(rows.length);
      renderTable(rows);
      renderCharts(rows);
    }

    initFilters();
    ["input", "change"].forEach((evt) => {
      els.q.addEventListener(evt, refresh);
      els.status.addEventListener(evt, refresh);
      els.project.addEventListener(evt, refresh);
      els.sprint.addEventListener(evt, refresh);
      els.assignee.addEventListener(evt, refresh);
    });
    refresh();
  </script>
