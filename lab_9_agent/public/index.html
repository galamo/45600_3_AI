<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ticket Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <h2>MCP tools</h2>
    <ul id="tools"><li class="muted">Loading…</li></ul>
    <button id="reload">Reload tools</button>
    <h2>Try</h2>
    <ul id="examples">
      <li>Who are the users in the system?</li>
      <li>Show all tickets assigned to Alice</li>
      <li>Find tickets about login</li>
      <li>Create a ticket "Fix footer" in the first project</li>
      <li>Move ticket 3 to in_review</li>
    </ul>
  </aside>

  <main>
    <header><h1>Ticket Agent</h1><button id="clear">New chat</button></header>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="Ask about tickets, users, projects…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
